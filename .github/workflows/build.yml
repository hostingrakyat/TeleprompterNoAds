name: Build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure signing (if keystore secret present)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found - configuring signed release."
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-key.jks
            {
              echo "storeFile=upload-key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret - building UNSIGNED release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # The release APK may be named app-release.apk (signed) or
          # app-release-unsigned.apk (no keystore). Pick whichever exists.
          APK=$(find build/app/outputs -name 'app-release*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "No release APK found!" >&2
            find build/app/outputs -name '*.apk' || true
            exit 1
          fi
          echo "Using APK: $APK"
          cp "$APK" dist/TeleprompterNoAds-release.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/TeleprompterNoAds-release.aab

      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-no-ads
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Teleprompter No Ads v1.0.0 (build ${{ github.run_number }})
          body: |
            Teleprompter No Ads - free, offline camera teleprompter. No ads, forever.

            Signed: ${{ steps.signing.outputs.signed }}

            - `TeleprompterNoAds-release.apk` - install on Android (sideload)
            - `TeleprompterNoAds-release.aab` - for Play Store upload
          files: |
            dist/TeleprompterNoAds-release.apk
            dist/TeleprompterNoAds-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/app/outputs/
            build/**/*.log
            android/app/build/outputs/logs/
          retention-days: 5
          if-no-files-found: ignore
