name: Build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get 2>&1 | tee -a build_output.log

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Keystore secret found - signing with your upload key (Play-ready)."
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-key.jks
            {
              echo "storeFile=upload-key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > android/key.properties
            echo "signed=upload-key" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret - generating an ephemeral release key so the APK installs."
            GEN_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            keytool -genkeypair \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype JKS -keystore android/upload-key.jks \
              -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
              -dname "CN=Riovan Styx Roring, OU=365 Days App Challenge, O=Independent, L=Balikpapan, ST=Kalimantan, C=ID"
            {
              echo "storeFile=upload-key.jks"
              echo "storePassword=$GEN_PASS"
              echo "keyPassword=$GEN_PASS"
              echo "keyAlias=upload"
            } > android/key.properties
            echo "signed=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a build_output.log

      - name: Build App Bundle (release)
        shell: bash
        run: |
          set -o pipefail
          flutter build appbundle --release 2>&1 | tee -a build_output.log

      - name: Rename artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # The release APK may be named app-release.apk (signed) or
          # app-release-unsigned.apk (no keystore). Pick whichever exists.
          APK=$(find build/app/outputs -name 'app-release*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "No release APK found!" >&2
            find build/app/outputs -name '*.apk' || true
            exit 1
          fi
          echo "Using APK: $APK"
          cp "$APK" dist/TeleprompterNoAds-release.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/TeleprompterNoAds-release.aab

      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-no-ads
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Teleprompter No Ads v1.0.0 (build ${{ github.run_number }})
          body: |
            Teleprompter No Ads - free, offline camera teleprompter. No ads, forever.

            Signing: ${{ steps.signing.outputs.signed }}

            - `TeleprompterNoAds-release.apk` - install on Android (sideload)
            - `TeleprompterNoAds-release.aab` - for Play Store upload
          files: |
            dist/TeleprompterNoAds-release.apk
            dist/TeleprompterNoAds-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_output.log
            build/app/outputs/
            build/**/*.log
            android/app/build/outputs/logs/
          retention-days: 5
          if-no-files-found: ignore

      - name: Report failure to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no log captured)';
            try { log = fs.readFileSync('build_output.log', 'utf8'); } catch (e) {}
            const tail = log.length > 10000 ? log.slice(-10000) : log;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI build failed — run ${context.runNumber}`,
              body: '<details><summary>build_output.log (tail)</summary>\n\n```\n' + tail + '\n```\n\n</details>'
            });
