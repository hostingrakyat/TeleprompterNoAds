name: Generate Keystore

# Run this workflow ONCE manually to generate an upload keystore.
# It prints 4 values to the job summary. Copy them into repository
# Settings > Secrets and variables > Actions > New repository secret:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
# After the secrets are set, build.yml will produce a SIGNED release.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias"
        required: true
        default: "upload"
      validity_days:
        description: "Validity in days"
        required: true
        default: "10000"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          set -euo pipefail

          STORE_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_ALIAS="${{ github.event.inputs.key_alias }}"
          VALIDITY="${{ github.event.inputs.validity_days }}"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY" \
            -storetype JKS \
            -keystore upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Riovan Styx Roring, OU=365 Days App Challenge, O=Independent, L=Balikpapan, ST=Kalimantan, C=ID"

          KEYSTORE_BASE64=$(base64 -w0 upload-key.jks)

          {
            echo "## Keystore generated"
            echo ""
            echo "Add these 4 repository secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo '| Secret name | Value |'
            echo '| --- | --- |'
            echo "| \`KEY_ALIAS\` | \`$KEY_ALIAS\` |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASSWORD\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASSWORD\` |"
            echo ""
            echo "### KEYSTORE_BASE64"
            echo '```'
            echo "$KEYSTORE_BASE64"
            echo '```'
            echo ""
            echo "**Manual fallback:** if copying from the summary is awkward, download the"
            echo "\`upload-key.jks\` artifact below and base64-encode it yourself, but treat it"
            echo "as a SECRET and delete the artifact afterwards."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: upload-key-jks
          path: upload-key.jks
          retention-days: 1
