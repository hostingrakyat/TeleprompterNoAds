name: teleprompter_no_ads
description: "Teleprompter No Ads - Free, offline camera teleprompter. No ads, forever."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  screen_brightness: ^2.1.2
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
